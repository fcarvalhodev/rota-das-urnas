# Busca o resultado do 2º turno no TSE de hora em hora e grava dados-tse.json.
# Quando o TSE chega a 100% apurado (ou depois de 27/10/2026), a Action se desliga sozinha.
# O site lê dados-tse.json e mostra o contador até a próxima busca.
name: Atualizar apuração (TSE)

on:
  schedule:
    - cron: "5 * * * *"        # minuto 5 de toda hora (UTC). O site conta até esse horário.
  workflow_dispatch: {}        # botão "Run workflow" para rodar na hora

permissions:
  contents: write              # commit do dados-tse.json
  actions: write               # desligar a própria Action no fim

concurrency:
  group: atualizar-tse
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Já terminou?
        id: antes
        run: |
          fim=$(python3 -c "import json;print('true' if json.load(open('dados-tse.json')).get('final') else 'false')" 2>/dev/null || echo false)
          hoje=$(date -u +%Y%m%d)
          if [ "$fim" = "true" ] || [ "$hoje" -gt 20261027 ]; then echo "parar=true" >> "$GITHUB_OUTPUT"; else echo "parar=false" >> "$GITHUB_OUTPUT"; fi

      - name: Buscar no TSE
        id: tse
        if: steps.antes.outputs.parar == 'false'
        run: python3 scripts/atualizar_tse.py --saida dados-tse.json

      - name: Salvar
        if: steps.antes.outputs.parar == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados-tse.json
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -m "Apuração TSE: $(python3 -c "import json;d=json.load(open('dados-tse.json'));b=d.get('brasil') or {};print(str(b.get('pst','sem dados'))+'% apurado')")"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Desligar a Action
        if: steps.antes.outputs.parar == 'true' || steps.tse.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable atualizar.yml --repo "${{ github.repository }}"
          echo "Apuração encerrada, Action desligada."
