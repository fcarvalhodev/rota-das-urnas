<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rota das Urnas</title>
<meta name="description" content="1º turno × 2º turno da eleição para presidente de 2026: clique no Brasil ou no exterior, escolha a região, o estado, o país ou a cidade e veja o que mudou.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Rota das Urnas: o esqueleto das Rotas, em formato de navegação.
   Qualquer número em até 3 cliques: Início → Brasil → estado; Início → Exterior → país → cidade.
   Cores dos candidatos: vermelho do PT para Lula e azul do PL para Flávio, as mesmas no site inteiro. */
:root{
  --bg:#eef0ee; --paper:#fbfcfb; --ink:#1b1f1c; --muted:#59605b; --line:#d2d8d3; --soft:#e3e8e4;
  --accent:#3c5a48; --accent-soft:#dce8e0;
  --lula:#c8102e; --flavio:#1d4fa3; --outros:#9a9fa0;
  --ok:#1f6b45; --ok-soft:#dcefe3; --no:#a12a2a; --no-soft:#f6dede; --part:#7a5a00; --part-soft:#f6ebc9; --calc:#4a5a8a; --calc-soft:#e1e6f3;
  --display:"Archivo","Arial Narrow",Impact,sans-serif;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111412; --paper:#181c19; --ink:#e7ece8; --muted:#9fa8a2; --line:#2b322d; --soft:#222824;
  --accent:#8cc4a2; --accent-soft:#1b2a21;
  --lula:#ff6b6b; --flavio:#6fa3ff; --outros:#6f7573;
  --ok:#7fd3a3; --ok-soft:#173326; --no:#f19b9b; --no-soft:#3a1c1c; --part:#e8c25a; --part-soft:#3a3016; --calc:#a9b8e6; --calc-soft:#1f2538; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111412; --paper:#181c19; --ink:#e7ece8; --muted:#9fa8a2; --line:#2b322d; --soft:#222824;
  --accent:#8cc4a2; --accent-soft:#1b2a21;
  --lula:#ff6b6b; --flavio:#6fa3ff; --outros:#6f7573;
  --ok:#7fd3a3; --ok-soft:#173326; --no:#f19b9b; --no-soft:#3a1c1c; --part:#e8c25a; --part-soft:#3a3016; --calc:#a9b8e6; --calc-soft:#1f2538; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:19px;line-height:1.6}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;margin:0;overflow-wrap:anywhere;text-wrap:balance}
h1{font-stretch:62%;font-size:clamp(46px,11vw,96px);line-height:.9}
h2{font-stretch:66%;font-weight:800;font-size:clamp(32px,7vw,48px);line-height:.95}
h3{font-family:var(--ui);font-weight:700;font-size:21px;line-height:1.2;margin:0}
p{margin:0}
.lg{font-size:21px;line-height:1.55}
.sub{color:var(--muted)}
.note{font-size:15px;color:var(--muted);line-height:1.5}

/* topo fixo: trilha + voltar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.back{font-family:var(--ui);font-weight:700;font-size:16px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font-family:var(--ui);font-size:15px;font-weight:600;min-width:0}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs span[aria-current]{color:var(--ink)}
.crumbs i{color:var(--line);font-style:normal}
.who{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--ui);font-weight:600;font-size:14px;margin-left:auto}
.who i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

/* telas */
#view{padding-block:28px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-height:70vh}
#view.enter{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view.enter{animation:none}}
.live{display:flex;gap:10px;align-items:flex-start;font-family:var(--ui);font-size:15px;font-weight:600;background:var(--paper);border:1px dashed var(--accent);border-radius:6px;padding:10px 14px;line-height:1.45}
.live .dot{flex:none;width:10px;height:10px;margin-top:5px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:12px;align-content:start}

/* portas da tela inicial */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.door{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;text-decoration:none;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:18px;transition:transform .15s,box-shadow .15s}
.door:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.door .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.door .t b{font-family:var(--display);font-stretch:66%;font-weight:900;font-size:44px;line-height:.9;text-transform:uppercase}
.door .t span{font-family:var(--ui);font-weight:800;font-size:16px;color:var(--accent)}
.door p{font-size:16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.door{transition:none}.door:hover{transform:none}}

.pies{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pie{margin:0;display:grid;gap:6px;justify-items:center;min-width:0}
.pv{width:100%;max-width:190px;aspect-ratio:1;position:relative;overflow:hidden}
.pv canvas{max-width:100%}
.pv.wait{border-radius:50%;border:2px dashed var(--line);background:repeating-linear-gradient(45deg,var(--soft) 0 8px,transparent 8px 16px);display:grid;place-content:center}
.pv.wait span{font-family:var(--ui);font-weight:700;font-size:14px;color:var(--muted);background:var(--paper);padding:2px 8px;border-radius:999px}
.pie figcaption{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pdiff{font-family:var(--ui);font-size:15px;text-align:center;color:var(--muted)}
.pleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--ui);font-weight:600;font-size:15px}
.pleg i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-2px}
/* barras */
.split{display:grid;gap:3px}
.split .lab{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;height:32px;border-radius:4px;overflow:hidden;background:var(--soft)}
.bar span{display:flex;align-items:center;padding-inline:8px;color:#fff;font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap;min-width:0;overflow:hidden;transition:width .5s ease}
.bar .l{background:var(--lula)} .bar .f{background:var(--flavio);justify-content:flex-end} .bar .o{background:var(--outros);justify-content:center}
.bar.wait{background:repeating-linear-gradient(45deg,var(--soft) 0 10px,transparent 10px 20px);border:1px dashed var(--line);justify-content:center;align-items:center;font-family:var(--ui);font-size:14px;font-weight:600;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--ui);font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;border:2px solid var(--c);color:var(--c);background:var(--paper)}
.delta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.delta div{background:var(--soft);border-radius:6px;padding:10px 12px;display:grid}
.delta b{font-family:var(--display);font-stretch:66%;font-weight:800;font-size:34px;line-height:1.05;color:var(--c)}
.delta span{font-family:var(--ui);font-size:14px;color:var(--muted)}
.badge{justify-self:start;font-family:var(--ui);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:2px solid var(--c);color:var(--c);background:var(--s)}
.badge.doc{--c:var(--ok);--s:var(--ok-soft)} .badge.aberto{--c:var(--part);--s:var(--part-soft)} .badge.alegacao{--c:var(--no);--s:var(--no-soft)} .badge.calc{--c:var(--calc);--s:var(--calc-soft)}

/* listas clicáveis */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;transition:border-color .15s,background .15s}
.row:hover{border-color:var(--ink);background:color-mix(in srgb,var(--paper) 85%,var(--accent-soft))}
.row .nm{font-family:var(--ui);font-weight:700;font-size:18px;line-height:1.2}
.row .nm small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.row .go{font-family:var(--ui);font-weight:800;font-size:22px;color:var(--muted);grid-row:span 2}
.row .mini{display:grid;gap:3px;grid-column:1}
.mini .b{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--soft)}
.mini .b i{display:block;height:100%}
.mini .b.w{background:repeating-linear-gradient(45deg,var(--soft) 0 5px,transparent 5px 10px);outline:1px dashed var(--line)}
.mini .cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.mini .cap b{font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:0;color:var(--c,var(--muted))}
.grp{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:10px;display:flex;justify-content:space-between;gap:8px}


/* crescimento + gráfico lado a lado */
.growth{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.gt{display:grid;gap:4px;align-content:start;background:var(--soft);border-left:6px solid var(--c);border-radius:6px;padding:12px 14px}
.who2{font-family:var(--ui);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.who2 i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.gbig{font-family:var(--display);font-stretch:62%;font-weight:900;font-size:clamp(48px,11vw,64px);line-height:.95;color:var(--c)}
.gbig.wait{font-size:clamp(30px,7vw,40px);color:var(--muted)}
.gsub{font-family:var(--ui);font-size:15px;line-height:1.4;color:var(--muted)} .gsub b{color:var(--ink)}
.sh{font-family:var(--ui);font-size:14px;line-height:1.35;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.sh small{font-size:12px}
.nowrap{white-space:nowrap}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.dl{display:grid;gap:2px;background:var(--soft);border-radius:6px;padding:12px 14px}
.dk{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dv{font-family:var(--display);font-stretch:62%;font-weight:900;font-size:clamp(36px,8vw,48px);line-height:1}
.dv.wait{color:var(--muted);font-size:clamp(28px,6vw,36px)}
.dd{font-family:var(--ui);font-size:15px;color:var(--muted)} .dd small{font-size:13px}
.concl{font-family:var(--ui);font-weight:600;font-size:17px;line-height:1.4;border-left:5px solid var(--c);padding:6px 0 6px 12px}
.concl b{color:var(--c)}
.chartwrap{display:grid;gap:8px}
.cv{position:relative;height:300px} .cv.sm{height:140px}
.axl{display:flex;justify-content:space-between;font-family:var(--ui);font-size:13px;font-weight:700;margin-top:-4px}
.seg.sm button{font-size:14px;padding:5px 12px}

.rg{grid-column:1;display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;font-family:var(--ui);font-size:15px;font-weight:600}
.rg>span i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px}
.rg>span b{color:var(--c);font-weight:800}
.rg .mut{color:var(--muted);font-weight:500;font-size:14px}
.rg .rd{margin-left:auto;font-size:13px;font-weight:800;color:var(--c)}

/* mapa de quadradinhos */
.mapbox{display:grid;gap:12px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;justify-self:start;flex-wrap:wrap}
.seg button{font-family:var(--ui);font-weight:700;font-size:15px;border:0;background:var(--paper);color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tmap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:440px;width:100%}
.tile{aspect-ratio:1;border-radius:6px;display:grid;place-content:center;text-align:center;text-decoration:none;color:#fff;background:var(--bgc,var(--soft));font-family:var(--ui);font-weight:800;font-size:clamp(12px,3.4vw,16px);line-height:1.05;transition:transform .12s,background .4s,opacity .3s;border:2px solid transparent}
.tile small{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(9px,2.4vw,11px);opacity:.92}
.tile:hover{transform:scale(1.08);border-color:var(--ink);z-index:1}
.tile.wait{background:repeating-linear-gradient(45deg,var(--soft) 0 6px,var(--paper) 6px 12px);color:var(--muted);border:1px dashed var(--line)}
.tile.dim{opacity:.22}
.scale{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:13px;font-weight:600;color:var(--muted);flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.tile,.bar span{transition:none}.tile:hover{transform:none}}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:820px){.cols.two{grid-template-columns:440px minmax(0,1fr);align-items:start}}

.big{font-family:var(--display);font-stretch:62%;font-weight:900;font-size:clamp(52px,12vw,84px);line-height:.9;color:var(--accent)}
.pool{display:grid;gap:7px}
.pool .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.pool .r .t{grid-column:1/-1;height:12px;background:var(--soft);border-radius:3px;overflow:hidden}
.pool .r .t i{display:block;height:100%;background:var(--outros)}
.pool .r b{font-family:var(--ui);font-size:16px} .pool .r span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;line-height:1.5}
.src a{color:var(--muted)}
footer{padding-block:20px 60px;color:var(--muted);font-size:14px;display:grid;gap:6px;border-top:1px solid var(--line)}
</style>
</head><body>

<script>
(function(){
const D=window.URNAS, V=document.getElementById('view');
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const pc=n=>n.toFixed(1).replace('.',',');
const sgn=n=>(n>0?'+':n<0?'−':'±')+fmt(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LBL={doc:'Documentado',aberto:'Em aberto',alegacao:'Alegação',calc:'Calculado'};
const LBLX={doc:'resultado completo do TSE',aberto:'parcial ou soma de boletins de urna',alegacao:'ainda sem confirmação',calc:'conta feita aqui a partir de outros números'};

/* ---------- contas ---------- */
const has=t=>t&&t.l!=null&&t.f!=null;
function share(t){ if(!t) return null; if(has(t)) return t.l/(t.l+t.f)*100; if(t.lp!=null&&t.fp!=null) return t.lp/(t.lp+t.fp)*100; return null; }
function sum(arr,k){ if(!arr.length||arr.some(x=>!has(x[k]))) return null; return {f:arr.reduce((a,x)=>a+x[k].f,0), l:arr.reduce((a,x)=>a+x[k].l,0)}; }
function read(t1,t2){ // leitura curta da mudança
  const s1=share(t1), s2=share(t2);
  if(s2==null) return {txt:'aguardando',c:'var(--muted)'};
  if(s1==null) return {txt:'só 2º turno',c:'var(--muted)'};
  const d=s2-s1;
  if((s1>=50)!==(s2>=50)) return {txt:'virou para '+(s2>=50?'Lula':'Flávio'),c:'var(--no)',d};
  if(Math.abs(d)<1) return {txt:'manteve',c:'var(--accent)',d};
  return {txt:(d>0?'+':'−')+pc(Math.abs(d))+' pt '+(d>0?'Lula':'Flávio'),c:d>0?'var(--lula)':'var(--flavio)',d};
}
function tags(t1,t2){
  const out=[]; const s1=share(t1), s2=share(t2); if(s1==null||s2==null) return out;
  const d=s2-s1, a=s1>=50?'Lula':'Flávio', b=s2>=50?'Lula':'Flávio';
  out.push(a!==b?['Virou para '+b,'var(--no)']:[b+' continua na frente','var(--muted)']);
  out.push(Math.abs(d)<1?['Manteve o equilíbrio','var(--accent)']:[`Pendeu ${pc(Math.abs(d))} pt para ${d>0?'Lula':'Flávio'}`,d>0?'var(--lula)':'var(--flavio)']);
  if(has(t1)&&has(t2)){ const dl=t2.l-t1.l, df=t2.f-t1.f;
    out.push(dl>0&&df>0?['Os dois ganharam votos','var(--ok)']:dl>0?['Só Lula ganhou votos','var(--lula)']:df>0?['Só Flávio ganhou votos','var(--flavio)']:['Os dois perderam votos','var(--no)']); }
  return out;
}

/* ---------- peças ---------- */
function bar(label,t,withOthers){
  if(!t) return `<div class="split"><div class="lab"><span>${label}</span></div><div class="bar wait">aguardando</div></div>`;
  let l,f,o=0;
  if(withOthers&&t.lp!=null){ l=t.lp; f=t.fp; o=Math.max(0,100-l-f); } else { l=share(t); f=100-l; }
  return `<div class="split"><div class="lab"><span>${label}</span><span>${o?'com os outros candidatos':'só os dois'}</span></div>
  <div class="bar" role="img" aria-label="${label}: Lula ${pc(l)}%, Flávio ${pc(f)}%${o?`, outros ${pc(o)}%`:''}"><span class="l" style="width:${l}%">${l>9?pc(l)+'%':''}</span>${o?`<span class="o" style="width:${o}%">${o>9?pc(o)+'%':''}</span>`:''}<span class="f" style="width:${f}%">${f>9?pc(f)+'%':''}</span></div></div>`;
}
const gr=(a,b)=>(b-a)/a*100;
const gp=n=>(n>=0?'+':'−')+pc(Math.abs(n))+'%';
const cmp=n=>n>=1e6?pc(n/1e6)+' mi':fmt(n);
const WHO={l:['Lula','--lula'],f:['Flávio','--flavio']};
// diferença entre os dois (pontos), positiva = Lula na frente
const marg=t=>{const s=share(t);return s==null?null:2*s-100;};
const lead=m=>m>=0?'Lula':'Flávio';
const leadC=m=>m>=0?'var(--lula)':'var(--flavio)';

/* gráficos (Chart.js) */
let CH=[], PEND=[];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function initCharts(){
  CH.forEach(c=>c.destroy()); CH=[];
  if(!window.Chart){ PEND=[]; return; }
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  Chart.defaults.font.family='Archivo, system-ui, -apple-system, "Segoe UI", sans-serif';
  Chart.defaults.color=css('--muted'); Chart.defaults.borderColor=css('--line');
  for(const f of PEND){ const el=document.getElementById(f.id); if(el) CH.push(f.make(el,reduce)); }
  PEND=[];
}
let uid=0;
function barsChart(t1,t2){
  const id='c'+(++uid), L=css('--lula'), F=css('--flavio'), ink=css('--ink');
  const canVotes=has(t1)||has(t2);
  const data=mode=>{
    const v=(t,k)=>{ if(!t) return null; if(mode==='votos') return has(t)?t[k]:null; const s=share(t); return s==null?null:(k==='l'?s:100-s); };
    return [[v(t1,'l'),v(t2,'l')],[v(t1,'f'),v(t2,'f')]];
  };
  let mode='pct';
  PEND.push({id,make:(el,reduce)=>{
    const d=data(mode);
    const ch=new Chart(el,{type:'bar',plugins:[ChartDataLabels],
      data:{labels:['1º turno','2º turno'],datasets:[
        {label:'Lula',data:d[0],backgroundColor:L,borderRadius:6,maxBarThickness:90},
        {label:'Flávio',data:d[1],backgroundColor:F,borderRadius:6,maxBarThickness:90}]},
      options:{responsive:true,maintainAspectRatio:false,animation:reduce?false:{duration:700},
        layout:{padding:{top:26}},
        plugins:{legend:{position:'bottom',labels:{boxWidth:14,font:{size:14,weight:'600'}}},
          tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.raw==null?'aguardando':(mode==='pct'?pc(c.raw)+'%':fmt(c.raw)+' votos'))}},
          datalabels:{anchor:'end',align:'end',color:ink,font:{family:'JetBrains Mono, monospace',weight:'600',size:13},
            formatter:v=>v==null?'':(mode==='pct'?pc(v)+'%':cmp(v))}},
        scales:{x:{grid:{display:false},ticks:{font:{size:14,weight:'700'},color:ink}},
          y:{beginAtZero:true,suggestedMax:mode==='pct'?100:undefined,ticks:{callback:v=>mode==='pct'?v+'%':cmp(v)}}}}});
    const box=el.closest('.chartwrap');
    box.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{
      mode=b.dataset.cm; box.querySelectorAll('[data-cm]').forEach(x=>x.setAttribute('aria-pressed',x===b));
      const d=data(mode); ch.data.datasets[0].data=d[0]; ch.data.datasets[1].data=d[1];
      ch.options.scales.y.suggestedMax=mode==='pct'?100:undefined; ch.update(); });
    return ch; }});
  const s1=share(t1), s2=share(t2);
  const alt=`1º turno: Lula ${s1!=null?pc(s1)+'%':'sem dado'}, Flávio ${s1!=null?pc(100-s1)+'%':'sem dado'}. 2º turno: ${s2!=null?`Lula ${pc(s2)}%, Flávio ${pc(100-s2)}%`:'aguardando'}.`;
  return `<div class="chartwrap"><div class="seg sm" role="group" aria-label="Mostrar em"><button type="button" data-cm="pct" aria-pressed="true">% entre os dois</button>${canVotes?'<button type="button" data-cm="votos" aria-pressed="false">Votos</button>':''}</div>
    <div class="cv"><canvas id="${id}" role="img" aria-label="${alt}"></canvas></div>${t2?'':'<p class="note">O 2º turno aparece aqui assim que sair o resultado.</p>'}</div>`;
}
function diffChart(t1,t2){
  const id='c'+(++uid), m1=marg(t1), m2=marg(t2);
  if(m1==null&&m2==null) return '';
  PEND.push({id,make:(el,reduce)=>{
    const L=css('--lula'),F=css('--flavio'),ink=css('--ink');
    const vals=[m1,m2], mx=Math.max(10,...vals.filter(v=>v!=null).map(Math.abs));
    const lim=Math.min(100,Math.ceil(mx*1.3/20)*20);
    return new Chart(el,{type:'bar',plugins:[ChartDataLabels],
      data:{labels:['1º turno','2º turno'],datasets:[{data:vals,backgroundColor:vals.map(v=>v==null?'transparent':(v>=0?L:F)),borderRadius:6,barThickness:34}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:reduce?false:{duration:700},
        layout:{padding:{left:4,right:8}},
        plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>c.raw==null?'aguardando':lead(c.raw)+' à frente por '+pc(Math.abs(c.raw))+' pontos'}},
          datalabels:{anchor:'end',align:'end',clamp:true,
            color:ink,font:{family:'JetBrains Mono, monospace',weight:'700',size:13},
            formatter:v=>v==null?'aguardando':lead(v)+' +'+pc(Math.abs(v))}},
        scales:{x:{min:-lim,max:lim,ticks:{stepSize:lim/2,callback:v=>v===0?'0':Math.abs(v)},grid:{color:c=>c.tick.value===0?ink:css('--line'),lineWidth:c=>c.tick.value===0?2:1}},
          y:{grid:{display:false},ticks:{font:{size:14,weight:'700'},color:ink}}}}});
  }});
  return `<div class="cv sm"><canvas id="${id}" role="img" aria-label="Diferença entre os dois: 1º turno ${m1!=null?lead(m1)+' por '+pc(Math.abs(m1))+' pontos':'sem dado'}; 2º turno ${m2!=null?lead(m2)+' por '+pc(Math.abs(m2))+' pontos':'aguardando'}."></canvas></div>
  <div class="axl"><span style="color:var(--flavio)">← Flávio na frente</span><span style="color:var(--lula)">Lula na frente →</span></div>`;
}
function diffBlock(t1,t2,others){
  const m1=marg(t1), m2=marg(t2), s1=share(t1), s2=share(t2);
  const line=(lbl,m,s,extra)=>m==null?`<div class="dl"><span class="dk">${lbl}</span><b class="dv wait">aguardando</b></div>`:
    `<div class="dl"><span class="dk">${lbl}</span><b class="dv" style="color:${leadC(m)}">${lead(m)} +${pc(Math.abs(m))} pontos</b><span class="dd">Lula ${pc(s)}% × Flávio ${pc(100-s)}%${extra||''}</span></div>`;
  const ex=others&&t1&&t1.lp!=null?`<br><small>contando os outros candidatos: Lula ${pc(t1.lp)}% × Flávio ${pc(t1.fp)}%</small>`:'';
  let concl='';
  if(m1!=null&&m2!=null){
    const d=Math.abs(m2)-Math.abs(m1);
    concl=(m1>=0)!==(m2>=0)?`<p class="concl" style="--c:var(--no)">Virou: no 1º turno quem estava na frente era ${lead(m1)}, no 2º é ${lead(m2)}.</p>`
      :Math.abs(d)<1?`<p class="concl" style="--c:var(--accent)">A diferença ficou praticamente igual (mudou ${pc(Math.abs(d))} ponto).</p>`
      :`<p class="concl" style="--c:${d<0?(m2>=0?'var(--flavio)':'var(--lula)'):leadC(m2)}">A diferença ${d<0?'diminuiu':'aumentou'} <b>${pc(Math.abs(d))} pontos</b>: ${lead(m2)} continua na frente, ${d<0?'mas com vantagem menor':'com vantagem maior'}.</p>`;
  }
  return `<div class="diff">${line('1º turno',m1,s1,ex)}${line('2º turno',m2,s2)}</div>${concl}`;
}
function growthLine(t1,t2){
  if(!has(t1)||!has(t2)) return '';
  const one=k=>{const [nm,c]=WHO[k];return `<div class="gt" style="--c:var(${c})"><span class="who2"><i></i>${nm}</span><b class="gbig">${gp(gr(t1[k],t2[k]))}</b><span class="gsub">votos em relação ao 1º turno<br><b>${fmt(t1[k])}</b> → <b>${fmt(t2[k])}</b> <span class="nowrap">(${sgn(t2[k]-t1[k])})</span></span></div>`;};
  return `<h3>Quanto cada um cresceu em votos</h3><div class="growth">${one('l')}${one('f')}</div>`;
}
function pieChart(t,withOthers,label){
  const id='c'+(++uid);
  let vals=null;
  if(t){ if(withOthers&&t.lp!=null) vals=[t.lp,t.fp,Math.max(0,100-t.lp-t.fp)]; else { const s=share(t); if(s!=null) vals=[s,100-s]; } }
  if(!vals) return `<figure class="pie"><div class="pv wait"><span>aguardando</span></div><figcaption>${label}</figcaption></figure>`;
  PEND.push({id,make:(el,reduce)=>new Chart(el,{type:'pie',plugins:[ChartDataLabels],
    data:{labels:vals.length===3?['Lula','Flávio','Outros']:['Lula','Flávio'],datasets:[{data:vals,
      backgroundColor:[css('--lula'),css('--flavio'),css('--outros')].slice(0,vals.length),borderColor:css('--paper'),borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:true,animation:reduce?false:{duration:700},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>c.label+': '+pc(c.raw)+'%'}},
        datalabels:{color:'#fff',font:{family:'JetBrains Mono, monospace',weight:'700',size:13},
          formatter:(v,c)=>v<7?'':(c.chart.data.labels[c.dataIndex]==='Outros'?'':pc(v)+'%')}}}})});
  const alt=vals.length===3?`Lula ${pc(vals[0])}%, Flávio ${pc(vals[1])}%, outros ${pc(vals[2])}%`:`Lula ${pc(vals[0])}%, Flávio ${pc(vals[1])}%`;
  return `<figure class="pie"><div class="pv"><canvas id="${id}" role="img" aria-label="${label}: ${alt}"></canvas></div><figcaption>${label}</figcaption></figure>`;
}
function pies(t1,t2,t2label){
  const m1=marg(t1), m2=marg(t2);
  return `<div class="pies">${pieChart(t1,true,'1º turno')}${pieChart(t2,false,t2label||'2º turno')}</div>
  <p class="pdiff">${m1!=null?`1º: <b style="color:${leadC(m1)}">${lead(m1)} +${pc(Math.abs(m1))} pts</b>`:''}${m2!=null?` · 2º: <b style="color:${leadC(m2)}">${lead(m2)} +${pc(Math.abs(m2))} pts</b>`:' · 2º: aguardando'}</p>`;
}
function compare(t1,t2,opt={}){
  const tg=tags(t1,t2).map(([t,c])=>`<span class="tag" style="--c:${c}">${t}</span>`).join('');
  return `<div class="card">
    <h3>Diferença entre Lula e Flávio</h3>
    ${diffBlock(t1,t2,opt.others)}
    ${diffChart(t1,t2)}
    <h3 style="margin-top:8px">1º e 2º turno lado a lado</h3>
    ${barsChart(t1,t2)}
    ${growthLine(t1,t2)}
    ${tg?`<div class="tags">${tg}</div>`:''}
    ${opt.status?`<span class="badge ${opt.status}" title="${LBLX[opt.status]}">${LBL[opt.status]}</span>`:''}${opt.nota?`<p class="note">${esc(opt.nota)}</p>`:''}</div>`;
}
function row(href,name,small,t1,t2){
  const r=read(t1,t2), m1=marg(t1), m2=marg(t2);
  const v=m=>m==null?'<span class="mut">—</span>':`<b style="color:${leadC(m)}">${lead(m)} +${pc(Math.abs(m))}</b>`;
  return `<a class="row" href="${href}"><span class="nm">${esc(name)}${small?`<small>${esc(small)}</small>`:''}</span><span class="go" aria-hidden="true">›</span>
  <span class="rg"><span>1º ${v(m1)}</span><span>2º ${m2==null?'<span class="mut">aguardando</span>':v(m2)}</span><b class="rd" style="--c:${r.c}">${r.txt}</b></span></a>`;
}

/* ---------- mapa ---------- */
let mapMode='t1';
function tileColor(e){ // devolve [cor, texto escuro?]
  let base,k;
  if(mapMode==='mud'){ const r=read(e.t1,e.t2); if(r.d==null) return null;
    if(Math.abs(r.d)<1) return ['var(--outros)',false];
    base=r.d>0?'var(--lula)':'var(--flavio)'; k=Math.min(100,45+Math.abs(r.d)*11); }
  else { const s=share(e[mapMode]); if(s==null) return null;
    base=s>=50?'var(--lula)':'var(--flavio)'; k=Math.min(100,35+Math.abs(s-50)*2.6); }
  return [`color-mix(in oklab,${base} ${k}%,var(--paper))`,k<62];
}
function tileLabel(e){
  if(mapMode==='mud'){ const r=read(e.t1,e.t2); return r.d==null?'':(Math.abs(r.d)<1?'=':(r.d>0?'+':'−')+pc(Math.abs(r.d))); }
  const s=share(e[mapMode]); if(s==null) return ''; return s>=50?'L '+Math.round(s):'F '+Math.round(100-s);
}
function tmap(focus){
  let h=''; for(const r of D.regioes) for(const e of r.estados){
    const c=tileColor(e), dim=focus&&focus!==r.id;
    h+=`<a class="tile${c?'':' wait'}${dim?' dim':''}" style="grid-column:${e.x+1};grid-row:${e.y+1};${c?`--bgc:${c[0]};${c[1]?'color:var(--ink)':''}`:''}" href="#/brasil/${r.id}/${e.uf}" aria-label="${e.nome}">${e.uf}<small>${tileLabel(e)}</small></a>`; }
  return h;
}
function mapBlock(focus){
  const any2=D.regioes.some(r=>r.estados.some(e=>e.t2));
  return `<div class="mapbox card"><div class="seg" role="group" aria-label="O que o mapa mostra">
    <button type="button" data-m="t1" aria-pressed="${mapMode==='t1'}">1º turno</button><button type="button" data-m="t2" aria-pressed="${mapMode==='t2'}">2º turno</button><button type="button" data-m="mud" aria-pressed="${mapMode==='mud'}">O que mudou</button></div>
    <div class="tmap" id="tmap">${tmap(focus)}</div>
    <div class="scale" id="scale">${scaleTxt()}</div>
    ${!any2&&mapMode!=='t1'?'<p class="note">Os estados ficam listrados até o TSE divulgar o 2º turno, a partir das 17h de Brasília.</p>':''}
    <p class="note">Toque em um estado para ver os números dele. L = % de Lula, F = % de Flávio, contando só os dois.</p></div>`;
}
function scaleTxt(){ return mapMode==='mud'?'<span style="color:var(--flavio)">■ pendeu para Flávio</span> <span>■ manteve</span> <span style="color:var(--lula)">■ pendeu para Lula</span>':'<span style="color:var(--flavio)">■ Flávio na frente</span><span style="color:var(--lula)">■ Lula na frente</span><span>· cor mais forte = vantagem maior</span>'; }

/* ---------- telas ---------- */
const BR=()=>D.brasil.t2||sum(D.regioes.map(r=>({t2:r.t2||sum(r.estados,'t2')})),'t2');
const regT1=r=>sum(r.estados,'t1'), regT2=r=>r.t2||sum(r.estados,'t2');
const regValid=r=>r.estados.reduce((a,e)=>a+e.t1.f/(e.t1.fp/100),0);

function home(){
  const b=D.brasil.t1, ex=D.exterior;
  const placesDone=[]; for(const p of ex.paises){ if(share(p.t1)!=null&&share(p.t2)!=null) placesDone.push({h:`#/exterior/${p.id}`,n:p.nome,r:read(p.t1,p.t2)}); }
  placesDone.sort((a,b)=>Math.abs(b.r.d)-Math.abs(a.r.d));
  return {crumbs:[], html:`
  <div class="kicker">Rota das Urnas</div>
  <h1>1º turno × 2º turno</h1>
  <p class="lg">Em 4 de outubro, Flávio Bolsonaro (PL) ficou em primeiro e Lula (PT) em segundo. Hoje os dois se enfrentam de novo. Escolha onde quer olhar.</p>
  <div class="live" role="status"><span class="dot" aria-hidden="true"></span><span>${esc(D.aviso)}</span></div>
  <div class="pleg"><span style="--c:var(--lula)"><i></i>Lula (PT)</span><span style="--c:var(--flavio)"><i></i>Flávio Bolsonaro (PL)</span><span style="--c:var(--outros)"><i></i>Outros candidatos (só no 1º turno)</span></div>
  <div class="doors">
    <a class="door" href="#/brasil"><span class="t"><b>Brasil</b><span>5 regiões · 27 estados ›</span></span>${pies({l:b.l,f:b.f,lp:b.l/b.validos*100,fp:b.f/b.validos*100},BR())}<p>Toque para ver o mapa e escolher a região ou o estado.</p></a>
    <a class="door" href="#/exterior"><span class="t"><b>Exterior</b><span>${ex.paises.length} países ›</span></span>${pies(ex.t1,ex.t2,ex.t2&&ex.t2.parcial?'2º turno (parcial)':'2º turno')}<p>Toque para escolher o país e depois a cidade.</p></a>
  </div>
  ${placesDone.length?`<section style="display:grid;gap:10px"><h2>Já dá para comparar</h2><p class="sub">Lugares do exterior com os dois turnos contados, do que mais mexeu para o que menos mexeu.</p><div class="list">${placesDone.slice(0,5).map(x=>{const p=ex.paises.find(p=>'#/exterior/'+p.id===x.h);return row(x.h,x.n,p.cont,p.t1,p.t2)}).join('')}</div><a class="note" href="#/exterior">Ver todos os países ›</a></section>`:''}
  <section style="display:grid;gap:10px"><h2>Como comparar sem enganar</h2>
  <p class="sub">No 1º turno havia 13 candidatos, então a porcentagem dos dois sempre sobe no 2º. Por isso cada tela mostra duas contas:</p>
  <div class="how"><div class="card"><h3>A balança entre os dois</h3><p class="note">No 1º turno, contamos só os votos de Lula e Flávio, como se fossem 100%, e comparamos com o 2º. Se mexeu menos de 1 ponto, aparece <b>“manteve”</b>.</p></div>
  <div class="card"><h3>Votos de verdade</h3><p class="note">Quantos votos <b>a mais ou a menos</b> cada um teve. Dá para ver se os dois cresceram, se só um cresceu ou se alguém perdeu.</p></div></div></section>
  <section style="display:grid;gap:10px"><h2>Os votos em jogo</h2>
  <div class="card"><span class="big">${fmt(b.validos-b.f-b.l)}</span><p>votos foram para outros candidatos no 1º turno. A vantagem de Flávio sobre Lula foi de <b>${fmt(b.f-b.l)}</b>.</p>
  <div class="pool">${D.brasil.outros.map(([n,v])=>`<div class="r"><b>${esc(n)}</b><span>${fmt(v)}</span><div class="t"><i style="width:${v/D.brasil.outros[0][1]*100}%"></i></div></div>`).join('')}</div></div></section>`};
}

function brasil(){
  return {crumbs:[['Brasil']], back:'#/', html:`
  <h2>Brasil</h2>
  <div class="cols two"><div>${mapBlock(null)}</div>
  <div style="display:grid;gap:10px"><p class="sub">Ou escolha a região:</p><div class="list">${D.regioes.map(r=>row(`#/brasil/${r.id}`,r.nome,r.estados.length+' estados',regT1(r),regT2(r))).join('')}</div></div></div>`};
}

function regiao(r){
  const t1=regT1(r), val=regValid(r);
  return {crumbs:[['Brasil','#/brasil'],[r.nome]], back:'#/brasil', html:`
  <h2>${r.nome}</h2>
  <div class="cols two"><div style="display:grid;gap:12px">${compare({...t1,lp:t1.l/val*100,fp:t1.f/val*100},regT2(r),{others:true})}
  <p class="note">No 1º turno, cerca de <b>${fmt(Math.round((val-t1.f-t1.l)/1000)*1000)}</b> votos da região foram para outros candidatos.</p></div>
  <div style="display:grid;gap:10px"><p class="sub">Escolha o estado:</p><div class="list">${r.estados.map(e=>row(`#/brasil/${r.id}/${e.uf}`,e.nome,e.uf,e.t1,e.t2)).join('')}</div></div></div>
  ${mapBlock(r.id)}`};
}

function estado(r,e){
  const i=r.estados.indexOf(e), prev=r.estados[(i-1+r.estados.length)%r.estados.length], next=r.estados[(i+1)%r.estados.length];
  return {crumbs:[['Brasil','#/brasil'],[r.nome,`#/brasil/${r.id}`],[e.nome]], back:`#/brasil/${r.id}`, html:`
  <div class="kicker">${r.nome}</div><h2>${e.nome}</h2>
  ${compare(e.t1,e.t2,{others:true,status:e.t2?e.status||'doc':null})}
  <p class="note">No 1º turno, ${pc(100-e.t1.fp-e.t1.lp)}% dos votos válidos foram para outros candidatos.</p>
  <div class="list" style="grid-template-columns:1fr 1fr">${row(`#/brasil/${r.id}/${prev.uf}`,'‹ '+prev.nome,'estado anterior',prev.t1,prev.t2)}${row(`#/brasil/${r.id}/${next.uf}`,next.nome+' ›','próximo estado',next.t1,next.t2)}</div>`};
}

function exterior(){
  const ex=D.exterior, conts=[...new Set(ex.paises.map(p=>p.cont))];
  const done=ex.paises.filter(p=>p.t2).length;
  return {crumbs:[['Exterior']], back:'#/', html:`
  <h2>Exterior</h2>
  ${compare(ex.t1,ex.t2,{others:true,nota:ex.t2nota})}
  <p class="sub">${done} de ${ex.paises.length} países já têm número do 2º turno. Escolha o país:</p>
  ${conts.map(c=>{const ps=ex.paises.filter(p=>p.cont===c);return `<div class="grp"><span>${c}</span><span>${ps.filter(p=>p.t2).length}/${ps.length} com 2º turno</span></div><div class="list">${ps.map(p=>row(`#/exterior/${p.id}`,p.nome,p.cidades?p.cidades.length+(p.cidades.length>1?' cidades':' cidade'):(p.eleitores?fmt(p.eleitores)+' eleitores':''),p.t1,p.t2)).join('')}</div>`}).join('')}
  <p class="note">A lista traz os maiores eleitorados e os países que já fecharam as urnas. O total oficial de todos os 134 países sai com a totalização do TSE.</p>`};
}

function pais(p){
  return {crumbs:[['Exterior','#/exterior'],[p.nome]], back:'#/exterior', html:`
  <div class="kicker">${p.cont}${p.eleitores?' · '+fmt(p.eleitores)+' eleitores':''}</div><h2>${esc(p.nome)}</h2>
  ${compare(p.t1,p.t2,{status:p.status,nota:p.nota})}
  ${p.cidades?`<p class="sub">Escolha a cidade:</p><div class="list">${p.cidades.map(c=>row(`#/exterior/${p.id}/${c.id}`,c.nome,'',c.t1,c.t2)).join('')}</div>`:'<p class="note">Neste país há uma só cidade com urna, ou as fontes não separam por cidade.</p>'}`};
}

function cidade(p,c){
  const i=p.cidades.indexOf(c), next=p.cidades[(i+1)%p.cidades.length];
  return {crumbs:[['Exterior','#/exterior'],[p.nome,`#/exterior/${p.id}`],[c.nome]], back:`#/exterior/${p.id}`, html:`
  <div class="kicker">${esc(p.nome)}</div><h2>${esc(c.nome)}</h2>
  ${compare(c.t1,c.t2,{status:c.t2?(c.status||'aberto'):null,nota:c.nota})}
  ${p.cidades.length>1?`<div class="list">${row(`#/exterior/${p.id}/${next.id}`,next.nome+' ›','próxima cidade',next.t1,next.t2)}</div>`:''}`};
}

function fontes(){
  return {crumbs:[['Fontes']], back:'#/', html:`
  <h2>Fontes e como a conta é feita</h2>
  <div class="card"><h3>As etiquetas</h3>${Object.keys(LBL).map(k=>`<p class="note"><span class="badge ${k}">${LBL[k]}</span> ${LBLX[k]}</p>`).join('')}</div>
  <div class="card"><h3>Limites</h3><p class="note">O site compara números, não explica por que alguém mudou o voto. A diferença entre os turnos pode vir de quem trocou de candidato, de quem votou em outro nome no 1º turno ou de quem foi (ou não foi) votar. Os números do 2º turno no exterior vêm de somas de boletins de urna publicadas pela imprensa e podem mudar um pouco na totalização do TSE. Tóquio e a China continental são calculados: total do país menos as outras cidades.</p></div>
  <div class="card"><h3>De onde vem cada número</h3><div class="src" style="display:grid;gap:6px">${D.fontes.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}</div></div>`};
}
function nf(){ return {crumbs:[['Não encontrado']], back:'#/', html:`<h2>Não achei esta página</h2><p><a href="#/">Voltar ao início</a></p>`}; }

/* ---------- roteador ---------- */
function route(){
  const parts=(location.hash.replace(/^#\/?/,'')||'').split('/').filter(Boolean).map(decodeURIComponent);
  let v;
  if(!parts.length) v=home();
  else if(parts[0]==='brasil'){
    if(!parts[1]) v=brasil();
    else { const r=D.regioes.find(r=>r.id===parts[1]);
      if(!r) v=nf(); else if(!parts[2]) v=regiao(r); else { const e=r.estados.find(e=>e.uf===parts[2].toUpperCase()); v=e?estado(r,e):nf(); } }
  } else if(parts[0]==='exterior'){
    if(!parts[1]) v=exterior();
    else { const p=D.exterior.paises.find(p=>p.id===parts[1]);
      if(!p) v=nf(); else if(!parts[2]) v=pais(p); else { const c=(p.cidades||[]).find(c=>c.id===parts[2]); v=c?cidade(p,c):nf(); } }
  } else if(parts[0]==='fontes') v=fontes(); else v=nf();

  V.innerHTML=v.html; initCharts(); V.classList.remove('enter'); void V.offsetWidth; V.classList.add('enter');
  const cr=document.getElementById('crumbs'), all=[['Início','#/'],...v.crumbs];
  cr.innerHTML=all.map((c,i)=>i===all.length-1?`<span aria-current="page">${esc(c[0])}</span>`:`<a href="${c[1]}">${esc(c[0])}</a>`).join('<i aria-hidden="true">›</i>');
  const bk=document.getElementById('back'); if(v.back){bk.hidden=false;bk.href=v.back;} else bk.hidden=true;
  const last=all[all.length-1][0]; document.title=(all.length>1?last+' · ':'')+'Rota das Urnas';
  window.scrollTo(0,0);
  if(route.ran){ const h=V.querySelector('h2,h1'); if(h){h.tabIndex=-1;h.focus({preventScroll:true});} }
  route.ran=true;
}
V.addEventListener('click',e=>{ const b=e.target.closest('.seg button'); if(!b) return;
  mapMode=b.dataset.m; V.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const m=location.hash.split('/')[2]; const focus=location.hash.startsWith('#/brasil/')&&m?m:null;
  document.getElementById('tmap').innerHTML=tmap(focus); document.getElementById('scale').innerHTML=scaleTxt(); });
window.addEventListener('hashchange',route);
document.getElementById('upd').textContent='Atualizado em '+D.atualizado+'.';
route();
})();
</script>
</body></html>
